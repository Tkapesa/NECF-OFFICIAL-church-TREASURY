services:
  # Backend API — custom domain: api.necftreausry.com
  - type: web
    name: necf-official-treasury-1
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile.backend
    region: oregon
    healthCheckPath: /api

    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PORT
        value: 8000
      - key: SERVE_FRONTEND
        value: 0
      - key: CORS_ORIGINS
        value: https://necftreausry.com,https://www.necftreausry.com
      - key: DEFAULT_ADMIN_USERNAME
        value: admin
      - key: DEFAULT_ADMIN_PASSWORD
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440

  # Frontend static site — custom domains: necftreausry.com, www.necftreausry.com
  - type: web
    name: frontend-necf
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://api.necftreausry.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
